<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>内示チェック</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 中身は src/data.js の getDemoData() から app.js が組み立てる。文字は最小限に -->
  <header class="top">
    <div class="top-inner">
      <div class="brand-block">
        <span class="brand">thomas</span>
        <h1 id="title">内示チェック</h1>
      </div>
      <div class="top-meta">
        <span class="asof" id="asOf"></span>
        <span class="badge">架空データ</span>
        <button type="button" class="top-btn" id="settingsBtn">設定</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="side" aria-label="案件">
      <label class="drop" id="drop" tabindex="0">
        <span class="drop-icon" aria-hidden="true">＋</span>
        <span class="drop-text">内示をここに置く</span>
        <span class="drop-sub">CSV・Excel・PDF・メール</span>
        <input type="file" id="dropInput" accept=".csv,.xlsx,.pdf,.txt,.eml,text/csv,application/pdf" hidden>
      </label>
      <div class="drop-foot"><span id="csvName" class="csv-name" hidden></span><button type="button" class="link small" id="memoBtn">メモ帳に転記</button><button type="button" class="link small" id="sampleBtn">見本</button></div>
      <button type="button" class="new-case" id="newCaseBtn">＋ 案件を作る</button>
      <nav id="folders" class="folder-list"></nav>
    </aside>

    <section class="main">
      <div class="scope-line"><span id="scopeName"></span></div>
      <nav class="tabs" id="tabs" aria-label="表示"></nav>
      <div id="panel" class="panel"></div>
      <footer class="foot"><button type="button" class="link" id="rulesBtn">？ 計算のしかた</button><span class="muted" id="footNote"></span></footer>
    </section>
  </main>

  <!-- AI は右下のボタンから -->
  <button type="button" class="chat-fab" id="chatFab" hidden>AI に聞く</button>
  <aside class="chat" id="chat" aria-label="AI に聞く" hidden>
    <header class="chat-head">
      <div class="ai-avatar" aria-hidden="true">AI</div>
      <div><h2>AI に聞く</h2><p id="chatScope"></p></div>
      <button type="button" class="chat-close" id="chatClose" aria-label="閉じる">×</button>
    </header>
    <div class="chat-log" id="log" aria-live="polite">
      <div class="msg assistant intro">表にある数字だけで答えます。</div>
    </div>
    <div class="chips" id="chips"></div>
    <form class="chat-form" id="form">
      <textarea id="input" rows="2" maxlength="2000" placeholder="質問を入力"></textarea>
      <button type="submit" id="send" aria-label="送信">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 11.5 21 3l-8.5 18-2.2-7.3L3 11.5Z" fill="currentColor"/></svg>
      </button>
    </form>
  </aside>

  <div class="pop" id="pop" role="dialog" hidden></div>
  <div class="overlay" id="overlay" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
