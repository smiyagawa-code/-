<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ACS株式会社様 在庫・内示モック</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 中身は src/data.js の getDemoData() から app.js が組み立てる -->
  <header class="hero">
    <div class="hero-inner">
      <div class="brand-block">
        <span class="brand">thomas</span>
        <span class="divider"></span>
        <div>
          <h1 id="title">ACS株式会社様 在庫・内示モック</h1>
          <p class="hero-sub" id="subtitle"></p>
        </div>
      </div>
      <div class="hero-meta">
        <label class="base-pick">基準日
          <select id="basePick" aria-label="基準日"></select>
        </label>
        <span class="badge">DEMO・架空データ</span>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="side" aria-label="フォルダ">
      <h2 class="side-title">フォルダ（内示の置き場）</h2>
      <nav id="folders" class="folder-list"></nav>
      <p class="side-note">8月版・9月版の内示（PDF／CSV）を案件ごとに置くと、右の表が更新される想定です。</p>
    </aside>

    <section class="main">
      <div class="scope-line"><span id="scopeName"></span><span id="baseNote" class="base-note"></span></div>
      <nav class="tabs" id="tabs" aria-label="表示"></nav>
      <div id="panel" class="panel"></div>
      <footer class="foot" id="footNote"></footer>
    </section>

    <aside class="chat" id="chat" aria-label="AI に聞く">
      <header class="chat-head">
        <div class="ai-avatar" aria-hidden="true">AI</div>
        <div>
          <h2>AI に聞く</h2>
          <p><span class="dot-live"></span><span id="chatScope">表の数字を読み上げます。計算はしません</span></p>
        </div>
      </header>
      <div class="chat-log" id="log" aria-live="polite">
        <div class="msg assistant intro">左のフォルダを選ぶと、その案件の表だけをもとに答えます。根拠・文面の下書き・読み取りの注意点をお聞きください。</div>
      </div>
      <div class="chips" id="chips"></div>
      <form class="chat-form" id="form">
        <textarea id="input" rows="2" maxlength="2000" placeholder="質問を入力（Enter で送信）"></textarea>
        <button type="submit" id="send" aria-label="送信">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 11.5 21 3l-8.5 18-2.2-7.3L3 11.5Z" fill="currentColor"/></svg>
        </button>
      </form>
    </aside>
  </main>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
