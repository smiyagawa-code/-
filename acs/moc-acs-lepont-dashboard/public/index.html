<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ACS株式会社様 在庫・内示 AIダッシュボード</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 中身は src/data.js の getDemoData() から app.js が組み立てる。ふつうはこのファイルは触らない -->
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-top">
        <div class="brand-block">
          <span class="brand">thomas</span>
          <span class="divider"></span>
          <div>
            <h1 id="title">ACS株式会社様 在庫・内示 AIダッシュボード</h1>
            <p class="hero-sub" id="subtitle"></p>
          </div>
        </div>
        <div class="hero-meta">
          <span class="period" id="period"></span>
          <a class="badge" id="formLink" href="/form.html" hidden>申請フォーム →</a>
          <span class="badge">DEMO・架空データ</span>
        </div>
      </div>
      <nav class="tabs" id="tabs" aria-label="区画"></nav>
      <div class="kpis" id="kpis"></div>
    </div>
  </header>

  <main class="layout">
    <div class="board">
      <section class="insights-wrap" id="insightsWrap" aria-label="AI が見つけた気づき">
        <div class="insights-head">
          <span class="spark-icon" aria-hidden="true">✦</span>
          <h2>AI が見つけた気づき</h2>
          <span class="muted" id="insightHint">押すと、AI がデータをもとに説明します</span>
        </div>
        <div class="insights" id="insights"></div>
      </section>
      <div id="sections" class="board"></div>
      <footer class="foot" id="footNote"></footer>
    </div>

    <aside class="chat" id="chat" aria-label="AI に聞く">
      <header class="chat-head">
        <div class="ai-avatar" aria-hidden="true">AI</div>
        <div>
          <h2>AI アナリスト</h2>
          <p><span class="dot-live"></span>画面のデータをもとに答えます</p>
        </div>
      </header>
      <div class="chat-log" id="log" aria-live="polite">
        <div class="msg assistant intro">こんにちは。グラフで気になったところを、そのまま聞いてください。</div>
      </div>
      <div class="chips" id="chips"></div>
      <form class="chat-form" id="form">
        <textarea id="input" rows="2" maxlength="2000" placeholder="質問を入力（Enter で送信）"></textarea>
        <button type="submit" id="send" aria-label="送信">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 11.5 21 3l-8.5 18-2.2-7.3L3 11.5Z" fill="currentColor"/></svg>
        </button>
      </form>
    </aside>
  </main>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
